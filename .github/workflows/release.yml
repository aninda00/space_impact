name: Build & Release Windows Executable

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Generate version tag
        id: version
        run: |
          $DATE = Get-Date -Format "yyyy.MM.dd"
          $COUNT = (git log --oneline --since="$DATE 00:00:00" --until="$DATE 23:59:59" | Measure-Object).Count
          echo "TAG=v$DATE-$COUNT" >> $env:GITHUB_OUTPUT

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "SpaceImpact" --clean --noconfirm main.py

      - name: Verify executable
        run: |
            if (Test-Path dist/SpaceImpact.exe) {
                Write-Host "Build verified successfully!"
            } else {
                Write-Error "Executable missing from dist directory!"
                exit 1
            }
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Release ${{ steps.version.outputs.TAG }}
          body: |
            ## Space Impact — Remastered
            
            **Automated Windows Build** 🎮
            
            **Version:** ${{ steps.version.outputs.TAG }}
            **Commit:** ${{ github.sha }}
            **Date:** ${{ github.event.head_commit.timestamp }}
            
            ### Download
            - **SpaceImpact.exe** — Portable Windows executable (no installation required)
            
            ### Features
            - 13 Sector Campaign with story
            - Endless Run, Boss Rush, Survival, Time Attack modes
            - 8 Enemy Types, 13 Unique Bosses
            - 10 Upgrades, Ship Customization (Skins & Parts)
            - High Score tracking, Achievements, Codex
            
            ### Requirements
            - Windows 10/11 (64-bit)
            - No Python or pygame installation needed — fully self-contained!
          files: |
            dist/SpaceImpact.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}